    credentials_env: {access_token: REUTERS_CONNECT_ACCESS_TOKEN}
    policy: metadata_only
    priority: 70
  - key: ft-api
    name: Financial Times (licensed API)
    publisher: Financial Times
    connector: ft
    enabled: true  # stays inactive until FT_API_URL + FT_API_KEY exist in .env
    url_env: FT_API_URL
    credentials_env: {api_key: FT_API_KEY}
    policy: metadata_only
    paywalled: true  # subscription required to read the article
    priority: 70
  - key: licensed-rss-1
    name: Licensed publisher feed (e.g. syndication RSS)
    connector: rss
    enabled: true  # stays inactive until LICENSED_RSS_1_URL exists in .env
    url_env: LICENSED_RSS_1_URL
    policy: metadata_only
    priority: 70

  # ------------------------------------------------------------------ scrapling (allowlist only)
  - key: scrapling-example
    name: Allowlisted site (example)
    connector: scrapling
    enabled: false
    url: https://example.org/news/
    policy: metadata_only
    min_interval_seconds: 10
    options:
      permission_confirmed: false  # set true only if the site permits automated access
      allowlist: ["https://example.org/news/"]
      mode: page
      item_selector: article
      title_selector: "h2 a::text"
      link_selector: "h2 a::attr(href)"
      date_selector: "time::attr(datetime)"
