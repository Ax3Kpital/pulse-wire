# Source registry. Edit this file to add/remove sources; restart is not required
# (it is re-read at the start of every scan).
#
# Required per source: key, name, connector, policy.
#   connector:  demo | rss | json_api | reuters_connect | ft | scrapling
#   policy:     metadata_only | temporary_excerpt | indexable_content
#   retention_days:           how long excerpts/content are kept (then purged)
#   metadata_retention_days:  optional; delete the whole record after N days
#   url / url_env:            public URL, or the NAME of a .env variable holding a private URL
#   credentials_env:          {field: ENV_VAR_NAME}; values live only in .env
#   priority:                 higher = preferred as a story's primary source
#   default_categories / exclude_categories / section_map: classification hints
#
# Reuters, Bloomberg, FT and the Washington Post: ONLY via feeds/APIs you are licensed for
# (connector rss/json_api/reuters_connect/ft with your private URL + credentials). Their
# article pages are never fetched, and the scrapling connector refuses them.

sources:
  # ------------------------------------------------------------------ demo (local fixtures)
  - key: demo-wire
    name: Demo Wire
    connector: demo
    demo: true
    enabled: true
    policy: temporary_excerpt
    retention_days: 30
    options: {feed: demo-wire}
  - key: demo-markets
    name: Demo Markets Daily
    connector: demo
    demo: true
    enabled: true
    policy: temporary_excerpt
    retention_days: 30
    options: {feed: demo-markets}
  - key: demo-policy
    name: Demo Policy Review
    connector: demo
    demo: true
    enabled: true
    policy: metadata_only
    options: {feed: demo-policy}
  - key: demo-industry
    name: Demo Industry Journal
    connector: demo
    demo: true
    enabled: true
    policy: indexable_content
    retention_days: 30
    options: {feed: demo-industry}
  - key: demo-flaky
    name: Demo Flaky Feed
    connector: demo
    demo: true
    enabled: false  # set true to see how a failing source is reported in the UI
    policy: metadata_only
    options: {feed: demo-flaky, simulate_error: "upstream returned 503"}

