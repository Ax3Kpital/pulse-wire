# Entity dictionary used for classification and story grouping.
#
#   id:          stable identifier
#   type:        institution | country | company | person | indicator
#   aliases:     matched case-insensitively on word boundaries
#   cs_aliases:  matched case-sensitively (short/ambiguous forms like "Fed", "BoE", "EU")
#   categories:  categories this entity supports (classification signal)
#   weight:      importance for story grouping (countries are weak: many different stories share them)

